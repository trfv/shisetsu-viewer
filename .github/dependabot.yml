version: 2
updates:
  - package-ecosystem: "github-actions"
    # 複合アクション (.github/actions/scrape) 内の action は "/" では追跡されないため明示する
    directories:
      - "/"
      - "/.github/actions/scrape"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # .npmrc の min-release-age より短いと、PR の lock が npm install で ETARGET になる
    cooldown:
      default-days: 3
    groups:
      # 互いに厳密固定し合う組。分けると ERESOLVE か workerd の多重化で CI が落ちる
      cloudflare:
        applies-to: version-updates
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/vite-plugin"
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-react"
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # 上の組と重なると同じ依存が 2 つの PR に入り、片方が conflict か superseded になる
      npm:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns:
          - "*"
        exclude-patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/vite-plugin"
          - "vitest"
          - "@vitest/*"
          - "vitest-browser-react"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "@mizchi/lsmcp"
      # 型だけ先行すると Node 24 に存在しない API がコンパイルを通る。.node-version と一緒に上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
