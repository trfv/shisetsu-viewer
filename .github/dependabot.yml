version: 2
updates:
  - package-ecosystem: "github-actions"
    # 複合アクション (.github/actions/scrape) 内の action は "/" では追跡されないため明示する
    directories:
      - "/"
      - "/.github/actions/scrape"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      include:
        - "*"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
      include:
        - "*"
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "@playwright/test"
          - "msw"
          - "vitest-browser-react"
      cloudflare:
        applies-to: version-updates
        patterns:
          - "wrangler"
          - "miniflare"
          - "@cloudflare/vitest-plugin"
          - "@cloudflare/vite-plugin"
      build:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/*"
      linting:
        applies-to: version-updates
        patterns:
          - "oxlint"
          - "oxfmt"
          - "knip"
      production-dependencies:
        applies-to: version-updates
        dependency-type: "production"
      development-dependencies:
        applies-to: version-updates
        dependency-type: "development"
      security-production:
        applies-to: security-updates
        dependency-type: "production"
        patterns:
          - "*"
      security-development:
        applies-to: security-updates
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      - dependency-name: "@mizchi/lsmcp"
      # 型だけ先行すると Node 24 に存在しない API がコンパイルを通る。.node-version と一緒に上げる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
