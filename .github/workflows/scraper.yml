permissions:
  contents: read
  id-token: write # D1 API への GitHub OIDC 認証
name: Run Scraper

on:
  workflow_dispatch:
    inputs:
      municipality:
        description: "Municipality to scrape"
        required: true
        type: choice
        options:
          - tokyo-koutou
          - tokyo-arakawa
          - tokyo-kita
          - tokyo-kita-genkiplaza
          - tokyo-kita-cocokita
          - tokyo-chuo
          - tokyo-sumida
          - tokyo-bunkyo
          - tokyo-toshima
          - tokyo-ota
          - tokyo-edogawa
          - tokyo-meguro
          - tokyo-shinagawa
          - kanagawa-kawasaki
          - all
      density:
        description: "Tests per shard (higher = fewer shards)"
        required: false
        default: "5"
        type: string
  schedule:
    # JST 17:23 / 05:23 起点。GitHub cron の実測遅延（最大 ~3.7h）を足しても
    # ota のメンテナンス窓（JST 02:00-05:00）に到達しない時刻に置く。
    # 分を 23 にするのは毎時 0 分の混雑を避けるため。
    - cron: "23 8,20 * * *"

jobs:
  prepare:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      nodeModulesCacheKey: ${{ steps.set-cache-keys.outputs.nodeModulesCacheKey }}
      playwrightCacheKey: ${{ steps.set-cache-keys.outputs.playwrightCacheKey }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set cache keys
        id: set-cache-keys
        run: |
          NODE_MODULES_HASH=$(sha256sum package-lock.json | awk '{ print $1 }')
          echo "nodeModulesCacheKey=${{ runner.os }}-node-modules-${NODE_MODULES_HASH}" >> $GITHUB_OUTPUT
          echo "playwrightCacheKey=${{ runner.os }}-playwright-${NODE_MODULES_HASH}" >> $GITHUB_OUTPUT
      - name: Set Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          node-version-file: .node-version
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: "**/node_modules"
          key: ${{ steps.set-cache-keys.outputs.nodeModulesCacheKey }}
      - name: Run npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.set-cache-keys.outputs.playwrightCacheKey }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            echo "::group::playwright install (attempt ${attempt})"
            if timeout -k 30 180 npx playwright install --with-deps chromium; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "playwright install attempt ${attempt} timed out or failed; retrying" >&2
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1
      - name: Set matrix
        id: set-matrix
        working-directory: packages/scraper
        env:
          # dispatch で自治体を指定した場合は registry の CI 除外を解除して --list に含める
          SCRAPER_FORCE_INCLUDE: ${{ github.event.inputs.municipality }}
          CI: "true"
          # dispatch 入力は必ず env 経由で渡す。run: に ${{ }} で直接展開すると
          # shell のパース前にテキスト置換されるため、任意コマンド実行を許してしまう
          MUNICIPALITY: ${{ github.event.inputs.municipality }}
          DENSITY: ${{ github.event.inputs.density || '5' }}
        run: |
          MATRIX=$(node scripts/shardMatrix.ts "${MUNICIPALITY:-all}" --density "${DENSITY}")
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  scrape:
    name: Scrape ${{ matrix.municipality }} (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: prepare
    timeout-minutes: 60
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Scraper
        uses: ./.github/actions/scrape
        env:
          # 予約データの唯一の書き込み先。未設定ならアップロードが起動時に失敗する
          D1_API_ENDPOINT: ${{ vars.D1_API_ENDPOINT }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        with:
          municipality: ${{ matrix.municipality }}
          shardIndex: ${{ matrix.shardIndex }}
          shardTotal: ${{ matrix.shardTotal }}
          nodeModulesCacheKey: ${{ needs.prepare.outputs.nodeModulesCacheKey }}
          playwrightCacheKey: ${{ needs.prepare.outputs.playwrightCacheKey }}
          debug: "false"
          jpProxyHostname: ${{ vars.JP_PROXY_HOSTNAME }}

  prepare_retry:
    runs-on: ubuntu-latest
    needs: scrape
    if: ${{ !cancelled() }}
    outputs:
      failedShards: ${{ steps.collect-failures.outputs.failedShards }}
    steps:
      - name: Collect failed shards
        id: collect-failures
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              console.log(`Found ${jobs.length} total jobs via pagination.`);
              const failedShards = jobs
                .filter((job) => job.name.startsWith('Scrape ') && job.conclusion === 'failure')
                .map((job) => job.name.match(/^Scrape (\S+) \((\d+)\/(\d+)\)$/))
                .filter((m) => m !== null)
                .map((m) => ({ municipality: m[1], shardIndex: m[2], shardTotal: m[3] }));
              console.log(`Failed shards: ${JSON.stringify(failedShards)}`);
              core.setOutput('failedShards', JSON.stringify(failedShards));
            } catch (error) {
              core.setFailed(`Failed to fetch jobs or process results: ${error.message}`);
              core.setOutput('failedShards', '[]');
            }

  retry_scrape:
    name: Retry Scrape ${{ matrix.municipality }} (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs:
      - prepare
      - prepare_retry
    if: needs.prepare_retry.outputs.failedShards != '[]'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{fromJson(needs.prepare_retry.outputs.failedShards)}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Scraper
        uses: ./.github/actions/scrape
        env:
          # 予約データの唯一の書き込み先。未設定ならアップロードが起動時に失敗する
          D1_API_ENDPOINT: ${{ vars.D1_API_ENDPOINT }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        with:
          municipality: ${{ matrix.municipality }}
          shardIndex: ${{ matrix.shardIndex }}
          shardTotal: ${{ matrix.shardTotal }}
          nodeModulesCacheKey: ${{ needs.prepare.outputs.nodeModulesCacheKey }}
          playwrightCacheKey: ${{ needs.prepare.outputs.playwrightCacheKey }}
          debug: "true"
          phase: "retry"
          jpProxyHostname: ${{ vars.JP_PROXY_HOSTNAME }}

  collect_failures:
    name: Collect structural failures
    runs-on: ubuntu-latest
    needs:
      - scrape
      - prepare_retry
      - retry_scrape
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      issues: write
      actions: read # run-summary のためにジョブ結果を読む
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Download failure artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: failures-retry-*
          path: failures
          merge-multiple: true
      # software factory の reconcile が読む自治体別の結果。run 全体の結論は見ない
      - name: Build run summary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: node packages/factory/src/cli/summarize.ts --run-id "${RUN_ID}" --failures-dir failures --out run-summary.json
      - name: Upload run summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: run-summary
          path: run-summary.json
          retention-days: 30
      # 相互監視：factory.yml が止まっていないか。逆向きは factory.yml が見る
      - name: Watchdog (Factory)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FACTORY_MODE: ${{ vars.FACTORY_MODE || 'observe' }}
          FACTORY_OWNER: ${{ github.repository_owner }}
        run: node packages/factory/src/cli/watchdog.ts --workflow factory.yml --key watchdog:factory
