name: Update Database

permissions:
  contents: read
  id-token: write # D1 API への GitHub OIDC 認証

on:
  workflow_dispatch:
    inputs:
      municipality:
        description: "Municipality to update"
        required: true
        type: choice
        options:
          - all
          - tokyo-koutou
          - tokyo-bunkyo
          - tokyo-kita
          - tokyo-toshima
          - tokyo-edogawa
          - tokyo-arakawa
          - tokyo-sumida
          - tokyo-ota
          - tokyo-suginami
          - tokyo-chuo
          - tokyo-meguro
          - tokyo-shinagawa
          - tokyo-minato
          - kanagawa-kawasaki
  # 施設 JSON の変更がマージされたら全自治体を流す（upsert は差分だけ書くので、変わっていない施設は 0 行）
  push:
    branches: [master]
    paths:
      - "packages/scraper/data/institutions/**"

jobs:
  prepare:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      municipality: ${{ steps.set-municipality.outputs.municipality }}
      nodeModulesCacheKey: ${{ steps.set-cache-keys.outputs.nodeModulesCacheKey }}
    steps:
      - name: Set municipality
        id: set-municipality
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ github.event.inputs.municipality }}" != "all" ]; then
            echo "municipality=${{ github.event.inputs.municipality }}" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set cache keys
        id: set-cache-keys
        run: |
          NODE_MODULES_HASH=$(sha256sum package-lock.json | awk '{ print $1 }')
          echo "nodeModulesCacheKey=${{ runner.os }}-node-modules-${NODE_MODULES_HASH}" >> $GITHUB_OUTPUT
      - name: Set Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          node-version-file: .node-version
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: "**/node_modules"
          key: ${{ steps.set-cache-keys.outputs.nodeModulesCacheKey }}
      - name: Run npm ci
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --ignore-scripts

  update:
    needs: prepare
    # api 待ち（最大 20 分）を含む
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
          node-version-file: .node-version
      - name: Restore cached node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: "**/node_modules"
          key: ${{ needs.prepare.outputs.nodeModulesCacheKey }}
      - name: Wait for the api of this commit
        # 同じ push で api 側（Workers Builds の監視パス）も変わっていれば、新しい api が出てから書く。
        # 先に書くと、古い api が知らない列（例: division_labels）を黙って捨てる
        if: github.event_name == 'push'
        shell: bash
        env:
          D1_API_ENDPOINT: ${{ vars.D1_API_ENDPOINT }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --quiet --depth=1 origin "$BEFORE"
          if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" \
            | grep -qE '^(package-lock\.json|packages/(api|shared)/)'; then
            echo "api 側の変更なし。待たずに反映する"
            exit 0
          fi
          want="${GITHUB_SHA:0:12}"
          # Workers Builds は テスト → マイグレーション → デプロイで 2〜3 分かかる
          for _ in $(seq 1 40); do
            got=$(curl -fsS "$D1_API_ENDPOINT/v1/health" | jq -r '.version // ""' || true)
            if [ "$got" = "$want" ]; then
              echo "api $want が稼働中"
              exit 0
            fi
            echo "待機中（稼働中: ${got:-不明}, 期待: $want）"
            sleep 30
          done
          echo "::error::20 分待っても api $want がデプロイされない。Workers Builds（shisetsu-api）のビルド履歴を確認する"
          exit 1
      - name: Update database data
        shell: bash
        working-directory: packages/scraper
        env:
          # 施設マスタの唯一の書き込み先。未設定なら起動時に失敗する
          D1_API_ENDPOINT: ${{ vars.D1_API_ENDPOINT }}
        run: |
          node tools/updateInstitutions.ts ${{ needs.prepare.outputs.municipality }}
